services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  api:
    build: .
    environment:
      PORT: "8000"
      SHRINKLY_REDIS_URL: redis://redis:6379/0
      SHRINKLY_DATA_DIR: /data
      SHRINKLY_MAX_UPLOAD_BYTES: "52428800"
      SHRINKLY_JOB_TIMEOUT_SECONDS: "900"
      SHRINKLY_TRUST_PROXY_HEADERS: "true"
    volumes:
      - shrinkly-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    networks:
      - internal
    command: ["--port", "8000"]

  worker:
    build: .
    entrypoint: ["rq"]
    command: ["worker", "shrinkly", "--url", "redis://redis:6379/0", "--logging-level", "INFO"]
    environment:
      SHRINKLY_REDIS_URL: redis://redis:6379/0
      SHRINKLY_DATA_DIR: /data
      SHRINKLY_MAX_UPLOAD_BYTES: "52428800"
      SHRINKLY_JOB_TIMEOUT_SECONDS: "900"
    volumes:
      - shrinkly-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 128
    networks:
      - internal

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks:
      - internal

volumes:
  redis-data:
  shrinkly-data:

networks:
  internal:
