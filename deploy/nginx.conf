limit_req_zone $binary_remote_addr zone=upload_init:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=300r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 9m;
    client_body_timeout 60s;
    client_header_timeout 30s;

    location = /api/upload/init {
        limit_req zone=upload_init burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
